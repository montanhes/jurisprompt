<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Converter PDF para Markdown | Zpply</title>
    <meta name="description" content="Converta qualquer PDF em Markdown estruturado e otimizado para IA. Reduza tokens, aumente a precisão das respostas e integre via API. Grátis para começar." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zpply.com/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://zpply.com/" />
    <meta property="og:title"       content="Converter PDF para Markdown | Zpply" />
    <meta property="og:description" content="Converta qualquer PDF em Markdown estruturado e otimizado para IA. Reduza tokens, aumente a precisão das respostas e integre via API." />
    <meta property="og:image"       content="https://zpply.com/og-image.png" />
    <meta property="og:locale"      content="pt_BR" />
    <meta property="og:site_name"   content="Zpply" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Converter PDF para Markdown | Zpply" />
    <meta name="twitter:description" content="Converta qualquer PDF em Markdown estruturado e otimizado para IA. Reduza tokens, aumente a precisão das respostas e integre via API." />
    <meta name="twitter:image"       content="https://zpply.com/og-image.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Zpply",
      "url": "https://zpply.com",
      "description": "Plataforma de conversão de PDFs para Markdown otimizado para modelos de linguagem.",
      "sameAs": []
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Zpply",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "BRL"
      },
      "description": "Converta qualquer PDF em Markdown estruturado e otimizado para LLMs. Reduza custos de API e aumente a precisão das análises."
    }
    </script>

    <!-- Fonts: preconnect + preload display font subset -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon placeholder -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
