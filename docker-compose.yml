services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zpply
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: zpply
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zpply"]
      interval: 10s
      timeout: 5s
      retries: 5

  docling:
    build: ./docling-svc
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G
    volumes:
      - docling_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://zpply:secret@postgres:5432/zpply
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - NODE_ENV=production
    volumes:
      - ./src:/app/src
      - uploads:/app/uploads
      - results:/app/results
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: node --watch src/server.js

  worker:
    build: .
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - DOCLING_URL=http://docling:8000
      - DATABASE_URL=postgresql://zpply:secret@postgres:5432/zpply
      - NODE_ENV=production
    volumes:
      - ./src:/app/src
      - uploads:/app/uploads
      - results:/app/results
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      docling:
        condition: service_healthy
    command: node --watch src/worker.js

volumes:
  redis_data:
  postgres_data:
  uploads:
  results:
  docling_cache:
